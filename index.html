<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="calc" aria-label="Calculadora">
      <div class="display">
        <div id="expressao" class="expressao" aria-live="polite"></div>
        <div id="resultado" class="resultado">0</div>
      </div>

      <div class="teclas">
        <button data-acao="limpar" class="fn">C</button>
        <button data-acao="apagar" class="fn" aria-label="Apagar">⌫</button>
        <button data-valor="%" class="fn">%</button>
        <button data-valor="/" class="op">÷</button>

        <button data-valor="7">7</button>
        <button data-valor="8">8</button>
        <button data-valor="9">9</button>
        <button data-valor="*" class="op">×</button>

        <button data-valor="4">4</button>
        <button data-valor="5">5</button>
        <button data-valor="6">6</button>
        <button data-valor="-" class="op">−</button>

        <button data-valor="1">1</button>
        <button data-valor="2">2</button>
        <button data-valor="3">3</button>
        <button data-valor="+" class="op">+</button>

        <button data-valor="(" class="fn">(</button>
        <button data-valor="0">0</button>
        <button data-valor=")" class="fn">)</button>
        <button data-valor="." >,</button>

        <button data-acao="igual" class="igual">=</button>
      </div>
    </section>

    <aside class="historico">
      <div class="historico-topo">
        <h2>Histórico</h2>
        <button id="limpar-historico" class="link">Limpar</button>
      </div>
      <ul id="lista-historico"></ul>
      <p id="historico-vazio" class="vazio">Sem cálculos ainda.</p>
    </aside>
  </main>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
