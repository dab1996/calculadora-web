<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Científica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="calc" aria-label="Calculadora">
      <div class="display">
        <button id="modo-angulo" class="modo" data-acao="angulo">DEG</button>
        <div id="expressao" class="expressao" aria-live="polite"></div>
        <div id="resultado" class="resultado">0</div>
      </div>

      <div class="teclas cientificas">
        <button data-valor="sin(" class="sci">sin</button>
        <button data-valor="cos(" class="sci">cos</button>
        <button data-valor="tan(" class="sci">tan</button>
        <button data-valor="pi" class="sci">π</button>
        <button data-valor="e" class="sci">e</button>

        <button data-valor="asin(" class="sci">sin⁻¹</button>
        <button data-valor="acos(" class="sci">cos⁻¹</button>
        <button data-valor="atan(" class="sci">tan⁻¹</button>
        <button data-acao="quadrado" class="sci">x²</button>
        <button data-valor="^" class="sci">xʸ</button>

        <button data-valor="ln(" class="sci">ln</button>
        <button data-valor="log(" class="sci">log</button>
        <button data-valor="sqrt(" class="sci">√</button>
        <button data-valor="cbrt(" class="sci">∛</button>
        <button data-acao="inverso" class="sci">x⁻¹</button>

        <button data-valor="exp(" class="sci">eˣ</button>
        <button data-acao="dez" class="sci">10ˣ</button>
        <button data-valor="abs(" class="sci">|x|</button>
        <button data-valor="!" class="sci">n!</button>
        <button data-valor="ans" class="sci">Ans</button>
      </div>

      <div class="teclas basicas">
        <button data-acao="limpar" class="fn">C</button>
        <button data-acao="apagar" class="fn" aria-label="Apagar">⌫</button>
        <button data-valor="%" class="fn">%</button>
        <button data-valor="/" class="op">÷</button>

        <button data-valor="7">7</button>
        <button data-valor="8">8</button>
        <button data-valor="9">9</button>
        <button data-valor="*" class="op">×</button>

        <button data-valor="4">4</button>
        <button data-valor="5">5</button>
        <button data-valor="6">6</button>
        <button data-valor="-" class="op">−</button>

        <button data-valor="1">1</button>
        <button data-valor="2">2</button>
        <button data-valor="3">3</button>
        <button data-valor="+" class="op">+</button>

        <button data-valor="(" class="fn">(</button>
        <button data-valor="0">0</button>
        <button data-valor=")" class="fn">)</button>
        <button data-valor="." >,</button>

        <button data-acao="igual" class="igual">=</button>
      </div>
    </section>

    <aside class="historico">
      <div class="historico-topo">
        <h2>Histórico</h2>
        <button id="limpar-historico" class="link">Limpar</button>
      </div>
      <ul id="lista-historico"></ul>
      <p id="historico-vazio" class="vazio">Sem cálculos ainda.</p>
    </aside>
  </main>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
